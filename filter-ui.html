<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Trip 2026 - Flight Finder</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a73e8;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1557b0;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: #666;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>✈️ Flight Finder</h1>
        <form id="flightForm">
            <div class="form-group">
                <label>Origin</label>
                <input type="text" id="origin" value="SFO" required placeholder="e.g. SFO">
            </div>
            <div class="form-group">
                <label>Destination</label>
                <input type="text" id="dest" value="JFK" required placeholder="e.g. LHR">
            </div>
            <div class="form-group">
                <label>Departure Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Return Date (Optional)</label>
                <input type="date" id="returnDate">
            </div>
            <button type="submit" id="submitBtn">Fetch & Save to Sheet</button>
        </form>

        <div id="loading" class="loading">Searching flights... This may take a few seconds.</div>
        <div id="status"></div>
    </div>

    <script>
        // Set default date to 2 months from now
        const dateInput = document.getElementById('date');
        const defaultDate = new Date();
        defaultDate.setMonth(defaultDate.getMonth() + 2);
        dateInput.value = defaultDate.toISOString().split('T')[0];

        document.getElementById('flightForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');

            btn.disabled = true;
            loading.style.display = 'block';
            status.style.display = 'none';
            status.className = '';

            const data = {
                origin: document.getElementById('origin').value.toUpperCase(),
                dest: document.getElementById('dest').value.toUpperCase(),
                date: document.getElementById('date').value,
                returnDate: document.getElementById('returnDate').value
            };

            try {
                const res = await fetch('/run-pipeline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                status.textContent = result.message;
                status.className = res.ok ? 'success' : 'error';
                status.style.display = 'block';
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'error';
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>

</html>
